name: Draft Faith Library Article

# Manual only. The Faith Library is curated: the model drafts one article, the
# draft must pass scripts/check_aeo.py, and it opens as a pull request for a
# person to read and merge. Nothing is published on a timer (see README).
on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Queue slug to draft (leave blank for the next pending keyword)"
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Quotes are checked word for word against the app's bundled KJV Bible.
      - name: Fetch the app's KJV Bible
        uses: actions/checkout@v4
        with:
          repository: victorlin-houzz/quotebible
          token: ${{ secrets.ARTICLES_PAT }}
          path: quotebible
          sparse-checkout: assets/bible

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install anthropic

      - name: Draft article
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KJV_BIBLE_PATH: quotebible/assets/bible/kjv.json
          SLUG: ${{ inputs.slug }}
        run: python scripts/generate_article.py --backend api ${SLUG:+--slug "$SLUG"}

      - name: Validate site
        env:
          KJV_BIBLE_PATH: quotebible/assets/bible/kjv.json
        run: python scripts/check_aeo.py

      - name: Open pull request for review
        env:
          GH_TOKEN: ${{ secrets.ARTICLES_PAT }}
        run: |
          git config user.name "Jesus Says Bot"
          git config user.email "swissashley@gmail.com"
          if git diff --quiet -- content _data; then echo "No draft produced."; exit 0; fi
          branch="draft/article-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$branch"
          git add content/ _data/ sitemap.xml llms.txt
          git commit -m "content: draft Faith Library article for review"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Draft Faith Library article" \
            --body "Drafted by scripts/generate_article.py and passed scripts/check_aeo.py. Read the whole article against docs/editorial-guidelines.md before merging."
